</style><style>.panda.shake{animation:shake .45s ease}@keyframes shake{0%,100%{transform:translateX(-50%) rotate(0)}20%,60%{transform:translateX(calc(-50% - 9px)) rotate(-12deg)}40%,80%{transform:translateX(calc(-50% + 9px)) rotate(12deg)}}</style></head><body><main class="app"><header><div class="brand"><div class="logo">🐼</div><div><h1>声调小熊猫 · 跳跳碰</h1><p>拼音缓缓飘落，小熊猫碰一碰！</p></div></div><div class="audio-tools"><button class="btn tiny" id="soundToggle" aria-label="切换读音和音效" title="切换读音和音效">🔊</button><button class="btn" id="menuBtn">🗺️ 选关</button></div></header><section class="stage" id="stage"><span class="cloud c1">☁</span><span class="cloud c2">☁</span><span class="cloud c3">☁</span><div class="hud"><span id="score">🌟 0</span><span id="levelLabel"></span><span id="paws">🐾🐾🐾</span><span id="medal">🏅 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question"><div class="hanzi" id="hanzi"></div><div class="prompt" id="prompt"></div><div class="feedback" id="feedback"></div></div><div class="options" id="options"></div><div class="ground"></div><div class="grass">♧　♧　♧　♧　♧</div><div class="panda" id="panda">🐼</div><div class="bamboo" aria-label="答对题目，竹子长高"><div class="bamboo-stalk" id="bambooStalk"></div><div class="bamboo-leaves" id="bambooLeaves"></div></div><div class="hint" id="hint">← → 移动　空格 / ↑ 跳跃　也可以直接点拼音卡片</div><div class="overlay" id="overlay"></div></section><footer><span>🌱 轻松练习，错了也没关系</span><span>手机：滑动移动 · 点击作答</span></footer></main><script>
const rawLevels=[

{id:'l5',title:'第一册 · 第5课',chars:[['风','fēng'],['云','yún'],['雨','yǔ'],['电','diàn'],['山','shān'],['石','shí'],['田','tián'],['禾','hé'],['金','jīn'],['木','mù'],['水','shuǐ'],['火','huǒ'],['土','tǔ']]},
{id:'l6',title:'第一册 · 第6课',chars:[['马','mǎ'],['牛','niú'],['羊','yáng'],['鸟','niǎo'],['虫','chóng'],['鱼','yú'],['衣','yī'],['米','mǐ'],['门','mén'],['车','chē'],['瓜','guā'],['果','guǒ']]},
{id:'l7',title:'第一册 · 第7课',chars:[['学','xué'],['生','shēng'],['家','jiā'],['好','hǎo'],['我','wǒ'],['叫','jiào'],['今','jīn'],['年','nián'],['岁','suì'],['是','shì'],['喜','xǐ'],['欢','huān'],['习','xí'],['文','wén']]},
{id:'l8',title:'第一册 · 第8课',chars:[['的','de'],['有','yǒu'],['爸','bà'],['妈','mā'],['哥','gē'],['姐','jiě'],['妹','mèi'],['和','hé'],['爱','ài']]},
{id:'l9',title:'第一册 · 第9课',chars:[['校','xiào'],['开','kāi'],['了','le'],['真','zhēn'],['高','gāo'],['兴','xìng'],['见','jiàn'],['老','lǎo'],['师','shī'],['说','shuō'],['早','zǎo'],['同','tóng'],['你','nǐ'],['们','men']]},
{id:'l10',title:'第一册 · 第10课',chars:[['认','rèn'],['方','fāng'],['向','xiàng'],['起','qǐ'],['面','miàn'],['太','tài'],['阳','yáng'],['前','qián'],['后','hòu'],['个','gè']]},
{id:'l11',title:'第一册 · 第11课',chars:[['季','jì'],['春','chūn'],['夏','xià'],['秋','qiū'],['冬','dōng'],['花','huā'],['知','zhī'],['唱','chàng'],['树','shù'],['叶','yè'],['黄','huáng'],['雪','xuě'],['飞','fēi']]},
{id:'l12',title:'第一册 · 第12课',chars:[['新','xīn'],['到','dào'],['热','rè'],['闹','nào'],['穿','chuān'],['戴','dài'],['帽','mào'],['祝','zhù'],['身','shēn'],['体','tǐ']]}
];
const accent={'a':['ā','á','ǎ','à'],'e':['ē','é','ě','è'],'i':['ī','í','ǐ','ì'],'o':['ō','ó','ǒ','ò'],'u':['ū','ú','ǔ','ù'],'ü':['ǖ','ǘ','ǚ','ǜ']};
const toneIndex={'ā':0,'á':1,'ǎ':2,'à':3,'ē':0,'é':1,'ě':2,'è':3,'ī':0,'í':1,'ǐ':2,'ì':3,'ō':0,'ó':1,'ǒ':2,'ò':3,'ū':0,'ú':1,'ǔ':2,'ù':3,'ǖ':0,'ǘ':1,'ǚ':2,'ǜ':3};
function toneOptions(p){const marked=[...p].find(ch=>ch in toneIndex),decomposed=marked?.normalize('NFD')||'',v=decomposed.startsWith('u\u0308')?'ü':decomposed[0]||[...p].find(ch=>ch in accent)||'a';let options;if(marked){options=(accent[v]||accent.a).map(ch=>p.replace(marked,ch))}else{const tones=accent[v]||accent.a;options=[p.replace(v,tones[0]),p.replace(v,tones[1]),p,p.replace(v,tones[3])]}return {pinyin:p,options,correctTone:toneIndex[marked]??-1}}
const levels=rawLevels.map(l=>({...l,chars:l.chars.map(([hanzi,pinyin])=>({hanzi,...toneOptions(pinyin)}))}));levels.push({id:'review',title:'第一册 · 总复习（随机20字）',chars:[]});
let save={};try{save=JSON.parse(localStorage.getItem('tone-panda-save')||'{}')}catch{};const s={unlocked:Math.min(levels.length-1,save.unlocked||0),score:save.score||0,best:save.best||{},level:0,q:0,correct:0,streak:0,misses:[],answered:false,menu:true,x:50,feedback:null,retry:false,soundOn:true};const $=id=>document.getElementById(id),persist=()=>localStorage.setItem('tone-panda-save',JSON.stringify({unlocked:s.unlocked,score:s.score,best:s.best})),round=()=>s.retry?s.retryData:levels[s.level];let mistakeMap={};try{mistakeMap=JSON.parse(localStorage.getItem('tone-panda-mistakes')||'{}')}catch{};const tricky=['女','了','的','们','牛','鸟','鱼','雨','马','妈','爸','八','十','石','左','右','日','月','东','冬','云','文','学','雪','生','声','喜','习','向','象','阳','羊','春','身','新','心','九','久','七','起','是','师','早','找','和','河'];function makeReview(){const all=rawLevels.flatMap(l=>l.chars.map(([hanzi,pinyin])=>({hanzi,...toneOptions(pinyin)}))),pool=[...new Map(all.map(x=>[x.hanzi,x])).values()];const rank=x=>(mistakeMap[x.hanzi]||0)*10+(tricky.includes(x.hanzi)?2:0)+Math.random();return pool.sort((a,b)=>rank(b)-rank(a)).slice(0,20)};
function menu(){s.menu=true;document.querySelector('.audio-tools').classList.remove('hide');$('soundToggle').classList.remove('hide');$('overlay').classList.remove('hide');$('overlay').innerHTML=`<div class="panel"><h2>声调小熊猫 · 跳跳碰</h2><p>选择任意一课，按自己的节奏练习！</p><div class="levels">${levels.map((l,i)=>`<button class="level" data-level="${i}">🐾　${l.title}　${'⭐'.repeat(s.best[l.id]||0)||'☆ ☆ ☆'}</button>`).join('')}</div><p>我的积分：${s.score}　${s.score>=50?'🧣 围巾已解锁':''}</p><p class="note">十二课和总复习都已开放，可随时选择。</p></div>`;$('overlay').querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));paint()}
function start(i){document.querySelector('.audio-tools').classList.remove('hide');$('soundToggle').classList.remove('hide');s.level=i;if(i===levels.length-1)levels[i].chars=makeReview();s.retry=false;s.q=0;s.correct=0;s.streak=0;s.misses=[];s.answered=false;s.feedback=null;s.menu=false;$('overlay').classList.add('hide');paint()}
function paint(){let r=round(),q=r?.chars[s.q];$('score').textContent='🌟 '+s.score;$('levelLabel').textContent=s.menu?'':`${r.title}　${Math.min(s.q+1,r.chars.length)} / ${r.chars.length}`;$('paws').textContent='🐾'.repeat(Math.max(1,3-Math.floor(s.misses.length/3)))+(s.streak>1?' 🔥'+s.streak:'');$('medal').textContent='🏅 '+Object.values(s.best).filter(v=>v>=2).length;$('bar').style.width=(q?s.q/r.chars.length*100:100)+'%';renderBamboo();$('hanzi').textContent=q?q.hanzi:'';$('prompt').textContent=q?'小熊猫想知道：这个字怎么读？':'';$('feedback').textContent='';$('options').innerHTML='';if(q){q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=o;if(s.feedback){if(s.feedback.good&&i===s.feedback.i)b.classList.add('good');if(!s.feedback.good&&i===s.feedback.i)b.classList.add('bad');if(!s.feedback.good&&o===q.pinyin)b.classList.add('good')}b.onclick=()=>answer(i);$('options').append(b)});if(s.feedback){$('feedback').textContent=s.feedback.good?'✓ 太棒了！'+q.pinyin+'　🌟':'再听听！正确读音是：'+q.pinyin+'　→';$('prompt').textContent=s.feedback.good?'答对啦！':'🎧 '+q.pinyin+'　'+tone(q.pinyin)}$('panda').style.left=s.x+'%'}else if(!s.menu)finish()}
function renderBamboo(){let n=s.correct,total=round().chars.length,maxHeight=Math.max(150,$('stage').clientHeight*.68),height=58+(maxHeight-58)*(n/total);$('bambooStalk').style.height=height+'px';$('bambooLeaves').innerHTML=Array.from({length:2+n},(_,i)=>`<span class="bamboo-leaf" style="bottom:${i*height/(n+1)}px">🌿</span>`).join('')}
function tone(p){let m=p.match(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/);return m?({'ā':'一声平平','á':'二声上扬','ǎ':'三声拐弯','à':'四声下降','ē':'一声平平','é':'二声上扬','ě':'三声拐弯','è':'四声下降','ī':'一声平平','í':'二声上扬','ǐ':'三声拐弯','ì':'四声下降','ō':'一声平平','ó':'二声上扬','ǒ':'三声拐弯','ò':'四声下降','ū':'一声平平','ú':'二声上扬','ǔ':'三声拐弯','ù':'四声下降','ǖ':'一声平平','ǘ':'二声上扬','ǚ':'三声拐弯','ǜ':'四声下降'})[m[0]]:'听一听声调'}function jump(){let p=$('panda');p.classList.remove('shake');p.classList.remove('jump');void p.offsetWidth;p.classList.add('jump');setTimeout(checkCollision,170)}function shake(){let p=$('panda');p.classList.remove('jump');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}let audioCtx=null,musicTimer=null,musicStep=0;function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function beep(ok){if(!s.soundOn)return;try{let c=getAudio(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?880:250;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.stop(c.currentTime+.18)}catch{}}function sayReading(text){if(!s.soundOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.78;u.pitch=1.05;let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}catch{}}
function answer(i){if(s.answered||s.menu)return;let q=round().chars[s.q],good=q.options[i]===q.pinyin;s.answered=true;s.feedback={good,i};good?jump():shake();if(good){s.correct++;s.streak++;s.score+=10+(s.streak%3===0?5:0)}else{s.streak=0;s.misses.push(q.hanzi);mistakeMap[q.hanzi]=(mistakeMap[q.hanzi]||0)+1;localStorage.setItem('tone-panda-mistakes',JSON.stringify(mistakeMap))}beep(good);sayReading(q.hanzi==='了'?'了，轻声 le':q.hanzi);paint();setTimeout(()=>{s.q++;s.answered=false;s.feedback=null;if(s.q>=round().chars.length)finish();else paint()},good?850:1500)}
function finish(){const total=round().chars.length,incorrect=total-s.correct,rate=Math.round(s.correct/total*100),wrong=[...new Set(s.misses)],stars=rate>=90?3:rate>=70?2:rate>=50?1:0,isReview=s.level===levels.length-1;s.score+=20+(s.correct===total?10:0);s.best[levels[s.level].id]=Math.max(stars,s.best[levels[s.level].id]||0);s.unlocked=Math.max(s.unlocked,Math.min(levels.length-1,s.level+1));persist();s.menu=true;$('soundToggle').classList.add('hide');$('overlay').classList.remove('hide');$('overlay').innerHTML=`<div class="panel"><h2>${isReview?'总复习完成！':'本课练习完成！'}</h2>${incorrect===0?'<div class="panda-bamboo-celebration" aria-label="熊猫坐在竹子上"><span>🐼</span><i></i><b>🌿　🌿</b></div>':''}<p class="result-count">✅ 答对 <b>${s.correct}</b> 个　❌ 答错 <b>${incorrect}</b> 个</p><p>正确率 ${rate}%　${'⭐'.repeat(stars)||'🌱'}${stars>=2?'　🏅 获得勋章！':''}</p><p>${wrong.length?'错题：'+wrong.join('、'):'本轮没有错题，真棒！'}</p><p>${isReview?'总复习结束。':'本课完成。'} 点击右上角“选关”可自由选择课程。</p></div>`}
function movePanda(dx){if(s.menu||s.answered)return;s.x=Math.max(8,Math.min(92,s.x+dx));$('panda').style.left=s.x+'%'}function checkCollision(){if(s.menu||s.answered)return;const pr=$('panda').getBoundingClientRect();for(const [i,el] of [...$('options').children].entries()){const r=el.getBoundingClientRect();if(pr.left<r.right&&pr.right>r.left&&pr.top<r.bottom&&pr.bottom>r.top){answer(i);return}}}document.addEventListener('keydown',e=>{if(s.menu)return;if(e.key==='ArrowLeft'){movePanda(-6)}if(e.key==='ArrowRight'){movePanda(6)}if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}});$('menuBtn').onclick=menu;$('soundToggle').onclick=()=>{s.soundOn=!s.soundOn;$('soundToggle').textContent=s.soundOn?'🔊':'🔇';if(s.soundOn)beep(true)};let tx=null;$('stage').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{if(tx===null)return;let dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>22){movePanda(dx>0?8:-8)}tx=null},{passive:true});paint();menu();
</script></body></html>
